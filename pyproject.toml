[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-client-persist-var"
version = "1.0.0"
description = "Reflex的持久前端状态，由浏览器localStorage支持。首屏即时加载，高频本地写入，以及双向后端推送/拉取。"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Luis·Li" },
]
keywords = ["reflex", "reflex-component", "localStorage", "persistent", "state"]


# localStorage访问是一个纯Python桥接工具，仅依赖于Reflex本身。
dependencies = ["reflex"]

[project.urls]
Homepage = "https://github.com/nacxa0/reflex-client-persist-var"
Demo = "https://clientpersistvar.nacxa.top"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_client_persist_var = ["*.py"]

