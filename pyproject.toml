[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-pcache"
version = "0.0.1"
description = "Persistent front-end state for Reflex, backed by browser localStorage. First-paint instant load, high-frequency local writes, and bidirectional backend push/retrieve."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "nacxa" },
]
keywords = ["reflex", "reflex-component", "localStorage", "cache", "persistent", "state"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# localStorage access is a pure-Python bridge that only depends on Reflex itself.
dependencies = [
    "reflex>=0.9.2",
]

[project.urls]
Homepage = "https://github.com/nacxa/reflex-pcache"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_pcache = ["*.py"]
